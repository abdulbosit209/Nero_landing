# Runs php-fpm and nginx as the two long-lived processes inside the app container,
# replacing the previous single `php -S` (PHP's built-in dev server) approach — that
# server isn't meant for production and its long-running process could end up unable
# to resolve its own router script. supervisord restarts either process if it dies,
# instead of the whole container going dark with no supervisor watching it.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
