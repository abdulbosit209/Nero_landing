# Reverse proxy in front of the app container — see docker-compose.prod.yml.
server {
    listen 80;
    server_name _;

    # Matches post_max_size in docker/uploads.ini so lead-form photo uploads
    # (up to LeadForm::MAX_PHOTOS originals) aren't rejected before reaching PHP.
    client_max_body_size 80M;

    location / {
        proxy_pass http://app:10000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
