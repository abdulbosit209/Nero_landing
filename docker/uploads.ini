; Raises PHP's upload limits above their compiled-in defaults (upload_max_filesize=2M,
; post_max_size=8M), which otherwise silently reject lead-form photos straight from a
; phone camera before the app-level validation in LeadForm ever runs. LeadForm::rules()
; re-compresses/validates on top of this; this file only controls what PHP will accept
; off the wire in the first place. Up to LeadForm::MAX_PHOTOS (5) originals per request.
upload_max_filesize = 15M
post_max_size = 80M
memory_limit = 256M
